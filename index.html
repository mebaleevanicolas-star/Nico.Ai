<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0a101f;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .gold-dust-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('gold-dust.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 1;
            opacity: 0.7;
        }

        .screen-container {
            width: 100vw;
            max-width: 100vw;
            height: 100vh;
            background: rgba(10, 20, 35, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 0;
            border: none;
            border-left: 1px solid rgba(212, 175, 55, 0.3);
            display: flex;
            box-shadow: none;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .sidebar {
            width: 90px;
            background: rgba(10, 15, 25, 0.8);
            border-right: 1px solid rgba(212, 175, 55, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            gap: 25px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            opacity: 0.6;
            transition: 0.3s;
            color: #f3e5ab;
            font-size: 0.75rem;
            text-align: center;
        }

        .nav-item.active, .nav-item:hover {
            opacity: 1;
        }

        .nav-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-item.active .nav-icon {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 25px 35px;
        }

        .top-status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-pill {
            background: rgba(15, 30, 60, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #f3e5ab;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .emotion-badges {
            display: flex;
            gap: 10px;
        }

        .badge {
            background: rgba(15, 30, 60, 0.5);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #ccc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge.active {
            background: rgba(30, 58, 138, 0.4);
            border-color: #d4af37;
            color: #f3e5ab;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            position: relative;
            gap: 30px;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            height: 100%;
        }

        .avatar-container {
            width: 320px;
            height: 420px;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .avatar-container img.fade-out {
            opacity: 0;
            transform: scale(0.95);
        }

        .audio-wave {
            position: absolute;
            bottom: 15px;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 15px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(212, 175, 55, 0.3);
            z-index: 3;
        }

        .wave-line {
            width: 3px;
            height: 15px;
            background: #d4af37;
            border-radius: 2px;
            animation: pulseWave 1s infinite alternate;
        }
        .wave-line:nth-child(2) { animation-delay: 0.2s; height: 25px; }
        .wave-line:nth-child(3) { animation-delay: 0.4s; height: 35px; }
        .wave-line:nth-child(4) { animation-delay: 0.1s; height: 20px; }
        .wave-line:nth-child(5) { animation-delay: 0.3s; height: 12px; }

        @keyframes pulseWave {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }

        .chat-section {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 10px;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            padding: 15px;
        }

        .chat-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(10, 20, 35, 0.75), rgba(10, 20, 35, 0.75)), url('gold-dust.gif.gif');
            background-size: cover;
            background-position: center;
            z-index: 1;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .score-board, .messages-container, .input-bar {
            position: relative;
            z-index: 2;
        }

        .score-board {
            display: none;
            background: rgba(20, 40, 80, 0.75);
            border: 1px solid #d4af37;
            padding: 8px 16px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #f3e5ab;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(5px);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-right: 10px;
            max-height: 350px;
            scroll-behavior: smooth;
        }

        .messages-container::-webkit-scrollbar {
            width: 5px;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.3);
            border-radius: 10px;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .message.jarvis {
            background: rgba(15, 35, 75, 0.9);
            backdrop-filter: blur(5px);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3), 0 0 10px rgba(212, 175, 55, 0.15);
        }

        .message.jarvis .j-avatar-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.75rem;
            font-weight: bold;
            flex-shrink: 0;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 6px 0;
            align-items: center;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #d4af37;
            border-radius: 50%;
            opacity: 0.4;
            animation: blink 1.4s infinite both;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.4; transform: scale(1); }
        }

        .input-bar {
            background: rgba(15, 30, 60, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid #d4af37;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 8px 8px 8px 20px;
            margin-top: 15px;
            gap: 10px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Montserrat', sans-serif;
        }

        .input-bar input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .marble-field {
            background: rgba(10, 20, 40, 0.6);
            border: 1px solid #d4af37 !important;
            border-radius: 20px;
            padding: 6px 12px;
            color: #fff;
            outline: none;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
            text-align: center;
        }

        .send-btn {
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            color: #f3e5ab;
            border: 1px solid #d4af37;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        .send-btn:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #f3e5ab;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .icon-btn:hover {
            opacity: 1;
            color: #fff;
            transform: scale(1.05);
        }

        .icon-btn.listening {
            opacity: 1;
            color: #ff4d4d;
            background: rgba(255, 77, 77, 0.15);
            border-radius: 50%;
            animation: micPulse 1s infinite;
        }

        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.5); }
            70% { box-shadow: 0 0 0 10px rgba(255, 77, 77, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
        }

        /* ============================================================
           RESPONSIVE - SMARTPHONE & TABLETTE
           Toutes les fonctionnalités (chat, calc, jeux, micro, etc.)
           restent identiques : on adapte uniquement la mise en page.
        ============================================================ */

        @media (max-width: 900px) {
            .avatar-container {
                width: 220px;
                height: 300px;
            }
        }

        @media (max-width: 768px) {
            html, body {
                height: 100vh;
                height: 100dvh;
            }

            .gold-dust-bg {
                height: 100vh;
                height: 100dvh;
            }

            .screen-container {
                flex-direction: column;
                height: 100vh;
                height: 100dvh;
                border-left: none;
            }

            /* La barre de navigation devient une barre du bas, façon app mobile */
            .sidebar {
                order: 2;
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-around;
                align-items: center;
                padding: 8px 4px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));
                gap: 0;
                border-right: none;
                border-top: 1px solid rgba(212, 175, 55, 0.2);
                flex-shrink: 0;
            }

            .nav-item {
                font-size: 0.62rem;
                gap: 3px;
            }

            .nav-icon {
                width: 38px;
                height: 38px;
                font-size: 1rem;
                border-radius: 10px;
            }

            .main-content {
                order: 1;
                flex: 1;
                min-height: 0;
                padding: 10px 12px 6px;
            }

            .top-status-bar {
                flex-wrap: wrap;
                gap: 8px;
                margin-bottom: 8px;
            }

            .status-pill {
                font-size: 0.68rem;
                padding: 6px 12px;
                gap: 6px;
            }

            .status-pill span {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 46vw;
            }

            .emotion-badges {
                gap: 6px;
            }

            .badge {
                font-size: 0.62rem;
                padding: 5px 10px;
            }

            /* Avatar + chat empilés au lieu de côte à côte */
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
                gap: 10px;
                min-height: 0;
                flex: 1;
            }

            .avatar-section {
                height: auto;
                flex-direction: row;
                justify-content: center;
            }

            .avatar-container {
                width: 90px;
                height: 118px;
                border-radius: 14px;
                box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            }

            .audio-wave {
                padding: 4px 10px;
                gap: 3px;
                bottom: 6px;
            }

            .wave-line {
                width: 2px;
            }

            .chat-section {
                min-height: 0;
                padding: 10px;
                border-radius: 16px;
            }

            .chat-section::before {
                border-radius: 16px;
            }

            .score-board {
                font-size: 0.72rem;
                padding: 6px 12px;
            }

            .messages-container {
                max-height: none;
                min-height: 0;
                gap: 8px;
            }

            .message {
                max-width: 92%;
                font-size: 0.85rem;
                padding: 10px 14px;
            }

            .message.jarvis .j-avatar-icon {
                width: 20px;
                height: 20px;
                font-size: 0.65rem;
            }

            .input-bar {
                flex-wrap: wrap;
                padding: 6px 6px 6px 14px;
                gap: 6px;
                margin-top: 10px;
            }

            .input-bar input#user-input {
                min-width: 90px;
                font-size: 0.9rem;
            }

            .marble-field {
                font-size: 0.8rem;
                padding: 6px 8px !important;
            }

            #marble-bet-input {
                width: 64px !important;
            }

            #marble-guess-input {
                width: 92px !important;
            }

            .send-btn {
                padding: 8px 16px;
                font-size: 0.85rem;
            }

            .icon-btn {
                font-size: 1rem;
                padding: 6px;
            }
        }

        @media (max-width: 420px) {
            .avatar-container {
                width: 66px;
                height: 88px;
                border-radius: 12px;
            }

            .nav-item span {
                display: none;
            }

            .nav-icon {
                width: 34px;
                height: 34px;
            }

            .status-pill span {
                max-width: 36vw;
            }

            #badge-mode {
                display: none;
            }

            .main-content {
                padding: 8px 8px 6px;
            }

            .message {
                font-size: 0.8rem;
                padding: 9px 12px;
            }

            .send-btn {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
        }

        /* Téléphone en mode paysage : on repasse en disposition côte à côte
           pour ne pas écraser verticalement le chat */
        @media (max-height: 480px) and (orientation: landscape) {
            .screen-container {
                flex-direction: row;
            }

            .sidebar {
                order: 0;
                width: 64px;
                height: 100%;
                flex-direction: column;
                justify-content: flex-start;
                padding-top: 20px;
                gap: 18px;
                border-right: 1px solid rgba(212, 175, 55, 0.2);
                border-top: none;
            }

            .nav-item span {
                display: none;
            }

            .main-content {
                order: 1;
                padding: 10px 16px;
            }

            .workspace {
                grid-template-columns: 110px 1fr;
                grid-template-rows: 1fr;
            }

            .avatar-section {
                height: 100%;
            }

            .avatar-container {
                width: 100px;
                height: 100%;
                max-height: 220px;
            }

            .messages-container {
                max-height: none;
            }
        }
    </style>
</head>
<body>

    <div class="gold-dust-bg"></div>

    <div class="screen-container">
        <div class="sidebar">
            <div class="nav-item active" onclick="switchMode('chat')" id="nav-chat">
                <div class="nav-icon">💬</div>
                <span>Chat</span>
            </div>
            <div class="nav-item" onclick="switchMode('calc')" id="nav-calc">
                <div class="nav-icon">🧮</div>
                <span>Calc</span>
            </div>
            <div class="nav-item" onclick="switchMode('game_menu')" id="nav-game">
                <div class="nav-icon">🎲</div>
                <span>Games</span>
            </div>
        </div>

        <div class="main-content">
            <div class="top-status-bar">
                <div class="status-pill">
                    <div class="status-dot"></div>
                    <span>JARVIS • ONLINE • READY TO HELP</span>
                </div>
                <div class="emotion-badges">
                    <div class="badge active" id="badge-emotion">🧠 Thinking</div>
                    <div class="badge" id="badge-mode">Mode: Accueil</div>
                </div>
            </div>

            <div class="workspace">
                <div class="avatar-section">
                    <div class="avatar-container">
                        <img id="avatar-img" src="JA1.jfif" alt="Jarvis Avatar">
                        <div class="audio-wave">
                            <div class="wave-line"></div>
                            <div class="wave-line"></div>
                            <div class="wave-line"></div>
                            <div class="wave-line"></div>
                            <div class="wave-line"></div>
                        </div>
                    </div>
                </div>

                <div class="chat-section">
                    <div class="score-board" id="score-board">
                        <span id="score-label-1">Score - Toi : <b id="score-user">0</b></span>
                        <span id="score-label-2">Jarvis : <b id="score-jarvis">0</b></span>
                    </div>

                    <div class="messages-container" id="messages-container">
                        <div class="message jarvis">
                            <div class="j-avatar-icon">J</div>
                            <div>Bienvenue sur Nico.AI 🤖<br>Que veux-tu faire aujourd'hui ?<br><b>Tape :</b><br>• <b>a</b> pour Discuter 💬<br>• <b>b</b> pour Calculer 🧮<br>• <b>c</b> pour Jouer (Games) 🎲</div>
                        </div>
                    </div>

                    <div class="input-bar" id="input-bar-container">
                        <input type="text" id="user-input" placeholder="Tape ta réponse ici..." autofocus onkeypress="handleKeyPress(event)">
                        
                        <input type="text" id="marble-bet-input" class="marble-field" placeholder="Billes" maxlength="4" style="display:none; width: 90px;" oninput="validateMarbleBet(this)" onkeypress="handleMarbleGuessKeyPress(event)">
                        <input type="text" id="marble-guess-input" class="marble-field" placeholder="pair / impair" style="display:none; width: 120px;" onkeypress="handleMarbleGuessKeyPress(event)">

                        <button class="icon-btn" id="mic-btn" title="Activer/désactiver le micro" onclick="toggleMic()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                                <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
                                <line x1="12" y1="19" x2="12" y2="22"></line>
                            </svg>
                        </button>
                        <button class="icon-btn" title="Pièce jointe">📎</button>
                        <button class="send-btn" id="main-send-btn" onclick="processInput()">Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <audio autoplay loop>
        <source src="Glass_and_Cedar.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas l'élément audio.
    </audio>

    <script>
        const EXPRESSIONS = {
            thinking: "JA3.jfif",
            happy: "JA1.jfif",
            sad: "JA2.jfif",
            surprised: "JA4.jfif",
            confident: "match nul.jfif", 
            annoyed: "tu as gagné.jfif",   
            sly: "perdu.jfif"        
        };

        let currentMode = 'home';
        let chatStep = 'menu';
        
        let userData = {
            name: '',
            age: null,
            state: '',
            food: '',
            calcSub: '',
            calcOp: '',
            calcNum1: null,
            userScore: 0,
            jarvisScore: 0,
            userMarbles: 10,
            jarvisMarbles: 10,
            marbleTurn: 'user_guess',
            savedInfo: null,
            savedKeyword: null,
            pendingQuestion: null,
            pendingQuiz: null,
            quiz: { active: false, topic: null, questions: [], index: 0, score: 0, correctList: [], wrongList: [] }
        };

        /* ============================================================
           MEMOIRE INTERNE DE JARVIS
           Quand Jarvis ne comprend pas une question, elle la mémorise.
           Si l'utilisateur lui explique, elle enregistre l'explication
           dans le localStorage (mémoire persistante entre les sessions)
           et pourra donc répondre correctement si la même question
           (ou une question très proche) est reposée plus tard.
        ============================================================ */
        let jarvisMemory = {};

        function loadMemory() {
            try {
                const stored = localStorage.getItem('jarvisMemory');
                jarvisMemory = stored ? JSON.parse(stored) : {};
            } catch (e) {
                jarvisMemory = {};
            }
        }

        function persistMemory() {
            try {
                localStorage.setItem('jarvisMemory', JSON.stringify(jarvisMemory));
            } catch (e) {
                console.warn("Impossible d'enregistrer la mémoire de Jarvis :", e);
            }
        }

        function normalizeKey(str) {
            return str
                .toLowerCase()
                .trim()
                .replace(/[?!.,;:'"]/g, '')
                .replace(/\s+/g, ' ');
        }

        function saveToMemory(question, explanation) {
            const key = normalizeKey(question);
            if (!key) return;
            jarvisMemory[key] = explanation;
            persistMemory();
        }

        function findInMemory(userMessage) {
            const normMsg = normalizeKey(userMessage);
            if (!normMsg) return null;

            if (jarvisMemory[normMsg]) return jarvisMemory[normMsg];

            let bestMatch = null;
            let bestLength = 0;
            for (const key in jarvisMemory) {
                if (normMsg.includes(key) || key.includes(normMsg)) {
                    if (key.length > bestLength) {
                        bestLength = key.length;
                        bestMatch = jarvisMemory[key];
                    }
                }
            }
            return bestMatch;
        }

        // Normalisation "large" : minuscules, sans accents, sans ponctuation.
        function normalizeText(str) {
            return str
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // supprime les accents
                .toLowerCase()
                .replace(/['’\-]/g, ' ') // apostrophes et tirets deviennent des espaces
                .replace(/[?!.,;:"()]/g, '')

        // Accorde "de/du/de la/des" + le nom d'un pays affiché (ex: "le Gabon" -> "du Gabon")
        function withDe(display) {
            if (display.startsWith('le ')) return 'du ' + display.slice(3);
            if (display.startsWith('les ')) return 'des ' + display.slice(4);
            if (display.startsWith('la ')) return 'de la ' + display.slice(3);
            if (display.startsWith("l'") || display.startsWith('l’')) return 'de ' + display;
            return 'de ' + display;
        }

        // Accorde "en/au/aux" + le nom d'un pays affiché (ex: "le Gabon" -> "au Gabon")
        function withEnAu(display) {
            if (display.startsWith('le ')) return 'au ' + display.slice(3);
            if (display.startsWith('les ')) return 'aux ' + display.slice(4);
            if (display.startsWith('la ')) return 'en ' + display.slice(3);
            if (display.startsWith("l'") || display.startsWith('l’')) return 'en ' + display.slice(2);
            return 'en ' + display;

        // Motifs de questions "qui est / c'est qui / tu connais / parle moi de..." -> capture le nom
        const ENTITY_PATTERNS = [
            /^c\s?est qui (.+)$/,
            /^qui est (.+)$/,
            /^qui etait (.+)$/,
            /^tu connais (.+)$/,
            /^connais tu (.+)$/,
            /^parle moi de (.+)$/,
            /^parles moi de (.+)$/,
            /^que sais tu sur (.+)$/,
            /^que sais tu (?:de|sur) (.+)$/,

            /^presente moi (.+)$/,
            /^c\s?est quoi (.+)$/,
            /^qu\s?est\s?ce que (.+)$/,
        ];

        function findEntity(name) {
            const cleanName = stripLeadingArticle(name);
            for (const key in ENTITY_DB) {
                for (const alias of ENTITY_DB[key].aliases) {
                    if (alias === cleanName || cleanName.includes(alias) || alias.includes(cleanName)) {
                        return ENTITY_DB[key];
                    }
                }
            }
            return null;
        }

        // Recherche générique par alias dans n'importe quelle base structurée
        // (utilisée par le football, le basket, les institutions, etc.)
        function findByAlias(db, rawName) {
            const clean = stripLeadingArticle((rawName || '').trim());
            if (!clean) return null;
            for (const key in db) {
                const entry = db[key];
                const aliases = entry.aliases || entry.names || [];
                for (const alias of aliases) {
                    if (alias === clean || clean.includes(alias) || alias.includes(clean)) {
                        return entry;
                    }
                }
            }
            return null;
        }

        function tryAnswerEntity(norm) {
            for (const pattern of ENTITY_PATTERNS) {
                const match = norm.match(pattern);
                if (match) {
                    const entity = findEntity(match[1]);
                    if (entity) {
                        return { reply: entity.bio, emotion: entity.emotion, label: entity.label };
                    }

                    const player = findByAlias(FOOTBALL_PLAYERS, match[1]);
                    if (player) {
                        return {
                            reply: `${player.name} est un footballeur ${player.nationality}, né le ${player.birth}, évoluant au poste de ${player.position}. Club actuel : ${player.club}. Palmarès : ${player.honors}. ${player.bio}`,
                            emotion: 'confident', label: '😎 Confidente'
                        };
                    }

                    const baller = findByAlias(BASKETBALL_PLAYERS, match[1]);
                    if (baller) {

                    const club = findByAlias(FOOTBALL_CLUBS, match[1]);
                    if (club) {

                            emotion: 'confident', label: '😎 Confidente'
                        };
                    }

                    const franchise = findByAlias(NBA_FRANCHISES, match[1]);
                    if (franchise) {
                        return {
                            reply: `${franchise.name} est une franchise NBA basée à ${franchise.city}, en conférence ${franchise.conference} (division ${franchise.division}), fondée en ${franchise.founded}. Palmarès : ${franchise.honors}.`,

                        };
                    }
                }
            }
            return null;
        }

        function trySportsRelations(norm) {

            m = norm.match(/^de quelle nationalite est (.+)$/);
            if (m) {

                if (p) return { reply: `${p.name} est de nationalité ${p.nationality}.`, emotion: 'confident', label: '😎 Confidente' };

            m = norm.match(/^quel est le parcours de (.+)$/);

                if (p) return { reply: `${p.name} évolue actuellement à : ${p.team}.`, emotion: 'confident', label: '😎 Confidente' };

        function findCountry(name) {
            const cleanName = stripLeadingArticle(name);
            for (const key in COUNTRIES) {
                for (const alias of COUNTRIES[key].names) {
                    if (alias === cleanName || cleanName.includes(alias) || alias.includes(cleanName)) {
                        return COUNTRIES[key];

            return null;

                return { reply: "Parmi les IA les plus connues aujourd'hui : ChatGPT (OpenAI), Claude (Anthropic), Gemini (Google)... et bien sûr moi, Jarvis ! 🤖✨", emotion: 'confident', label: '😎 Confidente' };
            }
            return null;
        }

        /* ---------- RÉSOLVEUR PRINCIPAL DE LA BASE DE CONNAISSANCES ---------- */
        function tryKnowledgeBase(rawVal) {
            const norm = normalizeText(rawVal);
            if (!norm) return null;

            const geo = tryAnswerGeography(norm);
            if (geo) return geo;

            const institution = tryAnswerInstitutions(norm);
            if (institution) return institution;

            const sportsRelation = trySportsRelations(norm);
            if (sportsRelation) return sportsRelation;

            const sport = trySportFacts(norm);
            if (sport) return sport;

            const tech = tryTechFacts(norm);
            if (tech) return tech;

            const entity = tryAnswerEntity(norm);
            if (entity) return entity;

            return null;
        }

        /* ============================================================================
           MOTEUR DE RECHERCHE WEB & COMMANDES NAVIGATEUR
           ----------------------------------------------------------------------------
           IMPORTANT (limite technique honnête) : une page HTML statique ne peut pas
           interroger Google/YouTube et lire leurs résultats à l'intérieur de la page
           (pas de clé API, et ces sites bloquent les requêtes cross-origin depuis un
           simple fichier HTML). Ce que Jarvis fait réellement, et qui fonctionne à
           100% : construire la bonne URL de recherche et l'ouvrir dans un nouvel
           onglet. C'est la seule "recherche Internet" fiable réalisable ici sans
           backend ni extension.
        ============================================================================ */

        function buildGoogleSearchUrl(q) { return 'https://www.google.com/search?q=' + encodeURIComponent(q); }
        function buildGoogleImagesUrl(q) { return 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q); }
        function buildGoogleVideosUrl(q) { return 'https://www.google.com/search?tbm=vid&q=' + encodeURIComponent(q); }
        function buildYoutubeSearchUrl(q) { return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q); }
        function buildWikipediaPageUrl(title) {
            const clean = title.trim().split(' ').filter(Boolean)
                .map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('_');
            return 'https://fr.wikipedia.org/wiki/' + encodeURIComponent(clean);
        }

        function openInNewTab(url, message, emotion = 'happy', label = '😊 Happy') {
            window.open(url, '_blank');
            jarvisReplyWithDelay(message, emotion, label);
        }

        /* ---------- DÉTECTION DES COMMANDES DE RECHERCHE (Google / Images / Vidéos / YouTube) ---------- */
        function detectSearchIntent(norm) {
            const hasVerb = /^(cherche|recherche|trouve|fais)/.test(norm);
            const mentionsYoutube = /youtube/.test(norm);
            const mentionsImage = /\bimages?\b|\bphotos?\b/.test(norm);
            const mentionsVideo = /\bvideos?\b/.test(norm) && !mentionsYoutube;
            const mentionsGoogle = /google/.test(norm);

            if (!hasVerb && !mentionsGoogle && !mentionsYoutube) return null;
            if (!hasVerb) return null; // évite les faux positifs type "j'aime bien youtube"

            let query = norm;
            query = query.replace(/^fais\s+une\s+recherche\s+google\s+(sur|pour)\s+/, '');
            query = query.replace(/^(cherche|recherche|trouve)\s+(moi\s+)?/, '');
            query = query.replace(/^(des\s+|de\s+|d\s+)?(images?|photos?|videos?)\s+(de\s+|d\s+|du\s+|des\s+)?/, '');
            query = query.replace(/^le\s+trailer\s+de\s+/, '');
            query = query.replace(/\s+sur\s+google\s+images?$/, '');
            query = query.replace(/\s+sur\s+google\s+videos?$/, '');
            query = query.replace(/\s+sur\s+(google|youtube)$/, '');
            query = query.trim();
            if (!query) return null;

            let type = 'google';
            if (mentionsYoutube) type = 'youtube';
            else if (mentionsImage) type = 'images';
            else if (mentionsVideo) type = 'videos';

            return { type, query };
        }

        function handleSearchIntent(intent) {
            const q = intent.query;
            if (intent.type === 'images') {
                openInNewTab(buildGoogleImagesUrl(q), `Voici une recherche d'images pour "${q}" sur Google Images 🖼️`);
            } else if (intent.type === 'videos') {
                openInNewTab(buildGoogleVideosUrl(q), `Voici une recherche de vidéos pour "${q}" 🎬`);
            } else if (intent.type === 'youtube') {
                openInNewTab(buildYoutubeSearchUrl(q), `Je t'ouvre YouTube avec une recherche sur "${q}" ▶️`);
            } else {
                openInNewTab(buildGoogleSearchUrl(q), `Voici une recherche Google pour "${q}" 🔎`);
            }
        }

        /* ---------- OUVERTURE DE PAGES SPÉCIFIQUES (ex: page Wikipédia précise) ---------- */
        function detectOpenPageIntent(rawNorm) {
            let m = rawNorm.match(/^ouvre\s+wikipedia\s+et\s+va\s+sur\s+la\s+page\s+de\s+(.+)$/);
            if (m) return { site: 'wikipedia', topic: m[1].trim() };
            m = rawNorm.match(/^ouvre\s+la\s+page\s+wikipedia\s+de\s+(.+)$/);
            if (m) return { site: 'wikipedia', topic: m[1].trim() };
            m = rawNorm.match(/^va\s+sur\s+la\s+page\s+wikipedia\s+de\s+(.+)$/);
            if (m) return { site: 'wikipedia', topic: m[1].trim() };
            return null;
        }

        function handleOpenPageIntent(intent) {
            if (intent.site === 'wikipedia') {
                const url = buildWikipediaPageUrl(intent.topic);
                openInNewTab(url, `Je t'ouvre la page Wikipédia la plus probable pour "${intent.topic}". ⚠️ Comme je ne peux pas vérifier le contenu de la page depuis cette interface, si l'article ne correspond pas exactement, utilise la barre de recherche de Wikipédia directement.`);
            }
        }

        /* ---------- OUVERTURE INTELLIGENTE DE SITES ---------- */
        function findSiteInMap(name) {
            const clean = stripLeadingArticle(name).trim();
            for (const key in SITE_MAP) {
                for (const alias of SITE_MAP[key].aliases) {
                    if (alias === clean || clean.includes(alias) || alias.includes(clean)) {
                        return SITE_MAP[key];
                    }
                }
            }
            return null;
        }

        function detectOpenSiteIntent(norm) {
            // "ouvre X", "ouvre le site de X", "ouvre le site officiel de X"
            let m = norm.match(/^ouvre\s+(?:le\s+site\s+(?:officiel\s+|internet\s+)?(?:de\s+|du\s+|des\s+|d\s+)?)?(.+)$/);
            if (!m) return null;
            const target = m[1].trim();
            if (!target) return null;
            return { target };
        }

        function handleOpenSiteIntent(intent) {
            const known = findSiteInMap(intent.target);
            if (known) {
                openInNewTab(known.url, `Bien sûr, j'ouvre le site officiel de ${known.name} dans un nouvel onglet. 🚀`);
                return;
            }
            // Site inconnu de la base locale : impossible de vérifier un domaine
            // officiel sans API de recherche depuis une simple page HTML. On ouvre
            // donc une recherche Google ciblée, en le disant clairement.
            const q = 'site officiel ' + intent.target;
            openInNewTab(
                buildGoogleSearchUrl(q),
                `Je ne connais pas encore le domaine officiel de "${intent.target}" dans ma base locale, et je ne peux pas le vérifier moi-même depuis cette page (ça nécessiterait une API de recherche ou un backend). Je t'ouvre donc une recherche Google ciblée pour trouver rapidement son site officiel. 🔎`,
                'thinking', '🧠 Thinking'
            );
        }

        /* ============================================================================
           WHATSAPP WEB — CE QUI EST RÉELLEMENT POSSIBLE
           ----------------------------------------------------------------------------
           Une page HTML ne peut PAS piloter un autre onglet/site (WhatsApp Web) :
           le navigateur l'interdit pour des raisons de sécurité (pas d'accès
           cross-origin au DOM d'un autre site). Ce serait nécessaire :
           une extension Chrome, une appli desktop avec automatisation, ou un backend.
           En revanche, les liens "wa.me" sont une fonctionnalité OFFICIELLE de
           WhatsApp : ils ouvrent une conversation PRÉ-REMPLIE avec un numéro donné.
           Jarvis utilise donc ça pour de vrai : elle a juste besoin que tu lui
           apprennes le numéro du contact une fois.
        ============================================================================ */
        let jarvisContacts = {};
        function loadContacts() {
            try {
                const stored = localStorage.getItem('jarvisContacts');
                jarvisContacts = stored ? JSON.parse(stored) : {};
            } catch (e) { jarvisContacts = {}; }
        }
        function persistContacts() {
            try { localStorage.setItem('jarvisContacts', JSON.stringify(jarvisContacts)); }
            catch (e) { console.warn("Impossible d'enregistrer les contacts :", e); }
        }
        loadContacts();

        function detectTeachContactCommand(norm) {
            const m = norm.match(/^retiens que le numero de (.+) est (.+)$/);
            if (!m) return null;
            return { name: m[1].trim(), phone: m[2].trim() };
        }

        function handleTeachContactCommand(intent) {
            const key = normalizeKey(intent.name);
            const phone = intent.phone.replace(/[^0-9+]/g, '');
            if (!phone) {
                jarvisReplyWithDelay("Ce numéro ne me semble pas valide 🤔 Réessaie avec le format international, par exemple +241XXXXXXXX.", 'surprised', '😲 Surprised');
                return;
            }
            jarvisContacts[key] = phone;
            persistContacts();
            jarvisReplyWithDelay(`C'est noté ! J'ai enregistré le numéro de ${intent.name} (${phone}) 📱✅. Tu peux maintenant me dire "écris [message] à ${intent.name} sur WhatsApp".`, 'happy', '😊 Happy');
        }

        function detectWhatsAppSendCommand(rawVal) {
            const m = rawVal.match(/^(?:écris|ecris|envoie|envoi)\s+(.+?)\s+(?:à|a)\s+(.+?)\s+sur\s+whatsapp(?:\s+web)?$/i);
            if (!m) return null;
            return { message: m[1].trim(), contact: m[2].trim() };
        }

        function handleWhatsAppSendCommand(intent) {
            const key = normalizeKey(intent.contact);
            const phone = jarvisContacts[key];
            if (!phone) {
                jarvisReplyWithDelay(`Je ne connais pas encore le numéro de ${intent.contact} 🤔<br>Apprends-le-moi avec : <b>"Retiens que le numéro de ${intent.contact} est +241XXXXXXXX"</b>, puis redemande-moi d'envoyer le message.<br><br>⚠️ Précision technique : je ne peux pas rechercher ni sélectionner un contact automatiquement dans WhatsApp Web (le navigateur interdit à cette page de contrôler un autre site). Ce que je peux faire de réel, c'est t'ouvrir une conversation WhatsApp pré-remplie via un lien officiel wa.me dès que j'ai le numéro.`, 'thinking', '🧠 Thinking');
                return;
            }
            const url = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(intent.message)}`;
            openInNewTab(url, `Je t'ouvre une conversation WhatsApp avec ${intent.contact}, message déjà pré-rempli : "${intent.message}". Il ne te reste qu'à cliquer sur Envoyer 📲 (je ne peux pas cliquer à ta place pour des raisons de sécurité du navigateur).`);
        }

        /* ============================================================================
           MODE "EXPLIQUE-MOI" + QUIZ
           ----------------------------------------------------------------------------
           S'appuie sur les bases structurées (Histoire, Institutions, Inventions,
           Pays, Culture pop) pour générer une explication pédagogique en 6 points,
           puis (si accepté) un quiz de 5 QCM générés à partir des mêmes données,
           avec correction, score et bilan.
        ============================================================================ */
        const EXPLAIN_PATTERNS = [
            /^explique\s+moi\s+(.+)$/,
            /^explique\s+(.+)$/,
            /^c\s?est\s+quoi\s+(.+)$/,
            /^qu\s?est\s?ce\s+que\s+(.+)$/,
            /^parle\s+moi\s+de\s+(.+)$/,
            /^parles\s+moi\s+de\s+(.+)$/,
            /^je\s+veux\s+comprendre\s+(.+)$/,
            /^raconte\s+moi\s+(.+)\s+simplement$/,
        ];

        const EXPLAIN_CATEGORIES = [
            { id: 'history', db: HISTORY_EVENTS },
            { id: 'institution', db: INSTITUTIONS },
            { id: 'invention', db: INVENTIONS },
            { id: 'culture', db: CULTURE_POP },
            { id: 'country', db: COUNTRIES },
        ];

        function findExplainTopic(rawName) {
            const clean = stripLeadingArticle(normalizeText(rawName));
            if (!clean) return null;
            for (const cat of EXPLAIN_CATEGORIES) {
                for (const key in cat.db) {
                    const entry = cat.db[key];
                    const aliasSource = entry.aliases || entry.names || [];
                    for (const alias of aliasSource) {
                        if (alias === clean || clean.includes(alias) || alias.includes(clean)) {
                            return { category: cat.id, key, entry };
                        }
                    }
                }
            }
            return null;
        }

        function buildExplanation(topic) {
            const { category, entry } = topic;
            const name = entry.name || entry.title || entry.display;
            let parts = [];

            if (category === 'history') {
                parts.push(`📖 <b>${name}</b>`);
                parts.push(`1️⃣ Définition simple : c'est un événement historique qui s'est déroulé de ${entry.start} à ${entry.end}, principalement ${entry.place}.`);
                parts.push(`2️⃣ Contexte / causes : ${entry.causes}`);
                parts.push(`3️⃣ Déroulement : ${entry.course}`);
                parts.push(`4️⃣ Conséquences : ${entry.consequences}`);
                parts.push(`5️⃣ En résumé : ${name} est un moment clé qui a durablement marqué l'Histoire, entre ${entry.start} et ${entry.end}.`);
            } else if (category === 'institution') {
                parts.push(`🏛️ <b>${name}</b>`);
                parts.push(`1️⃣ Définition simple : une organisation créée le ${entry.created}, dont le siège se trouve à ${entry.seat}.`);
                parts.push(`2️⃣ Contexte : ${entry.context}`);
                parts.push(`3️⃣ Rôle : ${entry.role}`);
                parts.push(`4️⃣ Chiffre clé : elle compte environ ${entry.members}.`);
                parts.push(`5️⃣ En résumé : ${name} joue un rôle central dans son domaine depuis sa création en ${entry.created}.`);
            } else if (category === 'invention') {
                parts.push(`💡 <b>${name}</b>`);
                parts.push(`1️⃣ Définition simple : ${name} est attribuée à ${entry.inventor}, vers ${entry.date}.`);
                parts.push(`2️⃣ Contexte : ${entry.context}`);
                parts.push(`3️⃣ Importance : ${entry.importance}`);
                parts.push(`4️⃣ Évolution : ${entry.evolution}`);
                parts.push(`5️⃣ En résumé : une invention qui a changé durablement notre quotidien.`);
            } else if (category === 'culture') {
                parts.push(`🎬 <b>${name}</b> (${entry.kind})`);
                parts.push(`1️⃣ Définition simple : sorti en ${entry.year} (${entry.country}), c'est une œuvre du genre ${entry.genre}.`);
                parts.push(`2️⃣ Créateur/réalisateur : ${entry.creator}.`);
                parts.push(`3️⃣ Résumé : ${entry.summary}`);
                parts.push(`4️⃣ En résumé : une œuvre marquante du genre ${entry.genre}.`);
            } else if (category === 'country') {
                parts.push(`🌍 <b>${name}</b>`);
                parts.push(`1️⃣ Définition simple : un pays du continent ${entry.continent} (${entry.subregion}), dont la capitale est ${entry.capital}.`);
                parts.push(`2️⃣ Chiffres clés : ${entry.population}, superficie d'environ ${entry.area}.`);
                parts.push(`3️⃣ Monnaie et langue : ${entry.currency} — ${entry.language}.`);
                if (entry.independence) {
                    parts.push(`4️⃣ Indépendance : ${entry.independence.date} (vis-à-vis de ${entry.independence.from}).`);
                }
                parts.push(`5️⃣ En résumé : ${name} se situe en ${entry.continent}, capitale ${entry.capital}.`);
            }

            parts.push(`<br><i>Veux-tu faire un petit quiz pour vérifier si tu as bien compris ? (réponds "oui" ou "non")</i>`);
            return parts.join('<br>');
        }

        function tryExplainTopic(rawVal, norm) {
            for (const pattern of EXPLAIN_PATTERNS) {
                const m = norm.match(pattern);
                if (m) {
                    const topic = findExplainTopic(m[1]);
                    if (topic) {
                        userData.pendingQuiz = topic;
                        return buildExplanation(topic);
                    }
                }
            }
            return null;
        }

        /* ---------- GÉNÉRATION DE QUIZ (QCM) À PARTIR DES DONNÉES STRUCTURÉES ---------- */
        const QUIZ_FIELD_CONFIG = {
            history: [
                { key: 'start', label: 'les dates de début', q: e => `En quelle année a commencé "${e.name}" ?` },
                { key: 'end', label: 'les dates de fin', q: e => `En quelle année s'est terminé "${e.name}" (à peu près) ?` },
                { key: 'place', label: 'le lieu', q: e => `Où s'est principalement déroulé "${e.name}" ?` },
                { key: 'causes', label: 'les causes', q: e => `Laquelle de ces affirmations décrit une cause de "${e.name}" ?`, truncate: 70 },
                { key: 'consequences', label: 'les conséquences', q: e => `Laquelle de ces affirmations décrit une conséquence de "${e.name}" ?`, truncate: 70 },
            ],
            institution: [
                { key: 'created', label: 'la date de création', q: e => `Quand ${e.name} a-t-elle été créée ?` },
                { key: 'seat', label: 'le siège', q: e => `Où se trouve le siège de ${e.name} ?` },
                { key: 'role', label: 'le rôle', q: e => `Quel est le rôle principal de ${e.name} ?`, truncate: 70 },
                { key: 'context', label: 'le contexte de création', q: e => `Dans quel contexte ${e.name} a-t-elle été créée ?`, truncate: 70 },
                { key: 'members', label: 'les membres', q: e => `Combien de membres compte environ ${e.name} ?` },
            ],
            invention: [
                { key: 'inventor', label: "l'inventeur", q: e => `Qui est à l'origine de ${e.name} ?` },
                { key: 'date', label: 'la date', q: e => `À quelle date/période remonte ${e.name} ?` },
                { key: 'context', label: 'le contexte', q: e => `Dans quel contexte ${e.name} est-elle apparue ?`, truncate: 70 },
                { key: 'importance', label: "l'importance", q: e => `Quelle est l'importance de ${e.name} ?`, truncate: 70 },
                { key: 'evolution', label: "l'évolution", q: e => `Comment ${e.name} a-t-elle évolué ?`, truncate: 70 },
            ],
            culture: [
                { key: 'year', label: 'la date de sortie', q: e => `De quand date "${e.title}" ?` },
                { key: 'country', label: 'le pays', q: e => `De quel pays vient "${e.title}" ?` },
                { key: 'genre', label: 'le genre', q: e => `Quel est le genre de "${e.title}" ?` },
                { key: 'creator', label: 'le créateur', q: e => `Qui a créé/réalisé "${e.title}" ?` },
                { key: 'summary', label: 'le résumé', q: e => `Quel résumé correspond à "${e.title}" ?`, truncate: 70 },
            ],
            country: [
                { key: 'capital', label: 'la capitale', q: e => `Quelle est la capitale ${withDe(e.display)} ?` },
                { key: 'continent', label: 'le continent', q: e => `Sur quel continent se trouve ${e.display} ?` },
                { key: 'population', label: 'la population', q: e => `Quelle est la population approximative ${withDe(e.display)} ?` },
                { key: 'currency', label: 'la monnaie', q: e => `Quelle est la monnaie ${withDe(e.display)} ?` },
                { key: 'language', label: 'la langue', q: e => `Quelle est la langue principale ${withDe(e.display)} ?` },
            ],
        };

        function truncateVal(v, n) {
            if (!n || !v) return v;
            return v.length > n ? v.slice(0, n) + '…' : v;
        }

        function shuffleArray(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function buildQuizForTopic(topic) {
            const { category, key, entry } = topic;
            const config = QUIZ_FIELD_CONFIG[category];
            if (!config) return [];
            const db = EXPLAIN_CATEGORIES.find(c => c.id === category).db;
            const otherKeys = Object.keys(db).filter(k => k !== key);

            const questions = [];
            for (const field of config) {
                const correctRaw = entry[field.key];
                if (!correctRaw) continue;
                const correct = truncateVal(String(correctRaw), field.truncate);

                const distractorPool = shuffleArray(otherKeys)
                    .map(k => db[k][field.key])
                    .filter(v => v && String(v) !== String(correctRaw))
                    .map(v => truncateVal(String(v), field.truncate));

                const uniqueDistractors = [...new Set(distractorPool)].slice(0, 3);
                while (uniqueDistractors.length < 3) uniqueDistractors.push('Aucune de ces réponses');

                const options = shuffleArray([correct, ...uniqueDistractors]);
                const correctIndex = options.indexOf(correct);

                questions.push({
                    question: field.q(entry),
                    options,
                    correctIndex,
                    fieldLabel: field.label,
                });
            }
            return shuffleArray(questions).slice(0, 5);
        }

        function startQuiz(topic) {
            const questions = buildQuizForTopic(topic);
            if (!questions.length) {
                jarvisReplyWithDelay("Désolé, je n'ai pas assez de données structurées sur ce sujet pour te générer un quiz. 😅", 'sad', '😔 Sad');
                userData.pendingQuiz = null;
                return;
            }
            userData.quiz = { active: true, topic, questions, index: 0, score: 0, correctList: [], wrongList: [] };
            userData.pendingQuiz = null;
            askQuizQuestion();
        }

        function askQuizQuestion() {
            const quiz = userData.quiz;
            const q = quiz.questions[quiz.index];
            const letters = ['a', 'b', 'c', 'd'];
            let text = `<b>Question ${quiz.index + 1}/${quiz.questions.length}</b> : ${q.question}<br>`;
            q.options.forEach((opt, i) => { text += `<b>${letters[i]}</b>. ${opt}<br>`; });
            text += `<i>Réponds avec la lettre (a, b, c ou d)</i>`;
            jarvisReplyWithDelay(text, 'thinking', '🧠 Thinking');
        }

        function evaluateQuizAnswer(rawVal) {
            const quiz = userData.quiz;
            const letters = ['a', 'b', 'c', 'd'];
            const answer = rawVal.trim().toLowerCase();
            const idx = letters.indexOf(answer);

            if (idx === -1) {
                jarvisReplyWithDelay("Réponds simplement par a, b, c ou d 🙂", 'thinking', '🧠 Thinking');
                return;
            }

            const q = quiz.questions[quiz.index];
            const isCorrect = idx === q.correctIndex;

            if (isCorrect) {
                quiz.score++;
                quiz.correctList.push(q.fieldLabel);
            } else {
                quiz.wrongList.push(q.fieldLabel);
            }

            let feedback = isCorrect
                ? `✅ Bonne réponse !`
                : `❌ Pas tout à fait ! La bonne réponse était : <b>${q.options[q.correctIndex]}</b>.`;

            quiz.index++;

            if (quiz.index >= quiz.questions.length) {
                const topicName = quiz.topic.entry.name || quiz.topic.entry.title || quiz.topic.entry.display;
                let bilan = `${feedback}<br><br>🏁 <b>Quiz terminé !</b> Score : ${quiz.score}/${quiz.questions.length} sur "${topicName}".<br>`;
                if (quiz.correctList.length) {
                    bilan += `<br>✅ Bien compris :<br>` + [...new Set(quiz.correctList)].map(x => `- ${x}`).join('<br>');
                }
                if (quiz.wrongList.length) {
                    bilan += `<br><br>📌 À revoir :<br>` + [...new Set(quiz.wrongList)].map(x => `- ${x}`).join('<br>');
                }
                const emotion = quiz.score >= Math.ceil(quiz.questions.length * 0.6) ? 'happy' : 'thinking';
                const label = emotion === 'happy' ? '😊 Happy' : '🧠 Thinking';
                userData.quiz = { active: false, topic: null, questions: [], index: 0, score: 0, correctList: [], wrongList: [] };
                jarvisReplyWithDelay(bilan, emotion, label);
            } else {
                jarvisReplyWithDelay(feedback, isCorrect ? 'happy' : 'surprised', isCorrect ? '😊 Happy' : '😲 Surprised');
                setTimeout(askQuizQuestion, 1400);
            }
        }


        /* ============================================================================
           DISPATCHER PRINCIPAL DES COMMANDES AVANCÉES
           ----------------------------------------------------------------------------
           Appelé en priorité pendant la boucle de conversation ('loop'). Gère, dans
           l'ordre : le quiz actif, l'offre de quiz en attente, l'apprentissage/envoi
           WhatsApp, le mode "explique-moi", l'ouverture de page précise, la recherche
           web (Google/Images/Vidéos/YouTube) et l'ouverture intelligente de sites.
           Retourne true si la commande a été prise en charge (une réponse a déjà
           été envoyée), false sinon (on continue vers le reste du moteur).
        ============================================================================ */
        function routeAdvancedIntent(rawVal, norm) {
            if (userData.quiz && userData.quiz.active) {
                evaluateQuizAnswer(rawVal);
                return true;
            }

            if (userData.pendingQuiz) {
                if (/^(oui|ouais|yes|ok|d\s?accord|vas\s?y)/.test(norm)) {
                    startQuiz(userData.pendingQuiz);
                    return true;
                }
                if (/^(non|no|pas\s+maintenant|pas\s+envie)/.test(norm)) {
                    userData.pendingQuiz = null;
                    jarvisReplyWithDelay("Pas de souci, on garde ça pour une prochaine fois ! Pose-moi une autre question quand tu veux 🙂", 'happy', '😊 Happy');
                    return true;
                }
                // Message sans rapport avec l'offre de quiz : on l'annule silencieusement
                // et on continue le traitement normal du nouveau message.
                userData.pendingQuiz = null;
            }

            const teach = detectTeachContactCommand(norm);
            if (teach) { handleTeachContactCommand(teach); return true; }

            const wa = detectWhatsAppSendCommand(rawVal);
            if (wa) { handleWhatsAppSendCommand(wa); return true; }

            const explanation = tryExplainTopic(rawVal, norm);
            if (explanation) { jarvisReplyWithDelay(explanation, 'confident', '😎 Confidente'); return true; }

            const pageIntent = detectOpenPageIntent(norm);
            if (pageIntent) { handleOpenPageIntent(pageIntent); return true; }

            const searchIntent = detectSearchIntent(norm);
            if (searchIntent) { handleSearchIntent(searchIntent); return true; }

            if (norm.startsWith('ouvre ')) {
                const siteIntent = detectOpenSiteIntent(norm);
                if (siteIntent) { handleOpenSiteIntent(siteIntent); return true; }
            }

            return false;
        }

        /* ============================================================
           RECONNAISSANCE VOCALE (MICRO)
           Un clic active le micro, un second clic le désactive.
           La voix est convertie en texte, injectée dans le champ de
           saisie puis envoyée automatiquement à Jarvis.
        ============================================================ */
        let recognition = null;
        let isListening = false;

        function getSpeechRecognitionAPI() {
            return window.SpeechRecognition || window.webkitSpeechRecognition || null;
        }

        function initSpeechRecognition() {
            const SpeechRecognitionAPI = getSpeechRecognitionAPI();
            if (!SpeechRecognitionAPI) return null;

            const rec = new SpeechRecognitionAPI();
            rec.lang = 'fr-FR';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                const inputField = document.getElementById('user-input');
                if (inputField) {
                    inputField.value = transcript;
                }
                stopListening();
                processInput();
            };

            rec.onerror = function(event) {
                console.warn('Erreur reconnaissance vocale :', event.error);
                stopListening();
            };

            rec.onend = function() {
                if (isListening) {
                    stopListening();
                }
            };

            return rec;
        }

        function toggleMic() {
            const SpeechRecognitionAPI = getSpeechRecognitionAPI();
            if (!SpeechRecognitionAPI) {
                alert("Désolé, la reconnaissance vocale n'est pas supportée par ce navigateur. Essaie avec Google Chrome sur ordinateur ou Android.");
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
            }

            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }

        function startListening() {
            if (!recognition) return;
            try {
                recognition.start();
                isListening = true;
                const micBtn = document.getElementById('mic-btn');
                const inputField = document.getElementById('user-input');
                if (micBtn) micBtn.classList.add('listening');
                if (inputField) inputField.placeholder = "Je t'écoute... parle maintenant 🎙️";
            } catch (e) {
                console.warn('Impossible de démarrer le micro :', e);
            }
        }

        function stopListening() {
            if (recognition) {
                try { recognition.stop(); } catch (e) { /* déjà arrêté */ }
            }
            isListening = false;
            const micBtn = document.getElementById('mic-btn');
            const inputField = document.getElementById('user-input');
            if (micBtn) micBtn.classList.remove('listening');
            if (inputField) inputField.placeholder = 'Tape ta réponse ici...';
        }

        function getSmartJarvisBet(maxAvailable) {
            if (maxAvailable <= 1) return 1;
            let rand = Math.random();
            if (rand < 0.6) {
                return Math.floor(Math.random() * Math.min(3, maxAvailable)) + 1;
            } else {
                return Math.floor(Math.random() * Math.min(5, maxAvailable)) + 1;
            }
        }

        function processMarbleUserGuessTurn() {
            const betInput = document.getElementById('marble-bet-input');
            const guessInput = document.getElementById('marble-guess-input');
            const betVal = parseInt(betInput.value, 10);
            const guessVal = guessInput.value.trim().toLowerCase();

            if (isNaN(betVal) || betVal < 1 || betVal > userData.userMarbles) {
                alert(`Entre un nombre de billes valide entre 1 et ${userData.userMarbles} (ton stock actuel) !`);
                return;
            }
            if (guessVal !== 'pair' && guessVal !== 'impair') {
                alert("Tu dois écrire explicitement 'pair' ou 'impair' !");
                return;
            }

            appendMessage('user', `Je parie ${betVal} billes et je dis ${guessVal}.`);
            betInput.value = '';
            guessInput.value = '';

            let jarvisMax = Math.min(10, userData.jarvisMarbles);
            let jarvisHidden;
            if (userData.userMarbles === 1) {
                let possibleImpaire = [];
                for (let i = 1; i <= jarvisMax; i += 2) {
                    possibleImpaire.push(i);
                }
                if (possibleImpaire.length > 0) {
                    jarvisHidden = possibleImpaire[Math.floor(Math.random() * possibleImpaire.length)];
                } else {
                    jarvisHidden = 1;
                }
            } else {
                jarvisHidden = Math.floor(Math.random() * jarvisMax) + 1;
            }

            let isEven = (jarvisHidden % 2 === 0);
            let actualParity = isEven ? 'pair' : 'impair';

            let responseText = `J'avais caché ${jarvisHidden} billes (${actualParity}). `;
            let emotion = 'happy';
            let label = '😊 Happy';

            if (guessVal === actualParity) {
                userData.userMarbles += jarvisHidden;
                userData.jarvisMarbles = Math.max(0, userData.jarvisMarbles - jarvisHidden);
                responseText += `Bien joué ! Tu as deviné juste, tu récupères mes ${jarvisHidden} billes cachées (+${jarvisHidden}).`;
                emotion = 'annoyed';
                label = '😤 Agacée';
            } else {
                userData.userMarbles = Math.max(0, userData.userMarbles - betVal);
                userData.jarvisMarbles += betVal;
                responseText += `Zut, tu t'es trompé ! Je récupère tes ${betVal} billes pariées (-${betVal} pour toi). Dommage ! 😈`;
                emotion = 'sly';
                label = '😏 Sournoise';
            }

            updateMarbleScores();

            if (userData.userMarbles <= 0) {
                jarvisReplyWithDelay(responseText + "<br><br><b>Victoire finale pour moi ! Tu n'as plus de billes. Game Over ! 😈</b>", 'sly', '😏 Sournoise');
                currentMode = 'game_menu';
                updateInputsVisibility();
                return;
            } else if (userData.jarvisMarbles <= 0) {
                jarvisReplyWithDelay(responseText + "<br><br><b>Félicitations ! Tu m'as pris toutes mes billes, tu gagnes la partie ! 🎉🏆</b>", 'annoyed', '😤 Agacée');
                currentMode = 'game_menu';
                updateInputsVisibility();
                return;
            }

            userData.marbleTurn = 'jarvis_guess';
            updateInputsVisibility();

            jarvisReplyWithDelay(responseText + "<br><br>C'est maintenant à mon tour de deviner ! Tape un nombre de billes que tu caches :", emotion, label);
        }
