                        stateMsg = "Je te comprends.";
                    }

                    jarvisReplyWithDelay(`${stateMsg}<br>Alors...quel est ton plat préféré ?`, emotion, emotion === 'sad' ? '😔 Sad' : '😊 Happy');
                } 
                else if (chatStep === 'food') {
                    userData.food = val;
                    chatStep = 'loop';
                    jarvisReplyWithDelay(`Intéressant... tu aimes bien manger ${userData.food} 😏<br>A toi la parole maintenant et si jamais t'as fini dis juste <b>'bye'</b> et je comprendrais`, 'happy', '😊 Happy');
                } 
                else if (chatStep === 'loop') {
                    const q = val.toLowerCase();
                    if (q === 'bye') {
                        jarvisReplyWithDelay("Aurevoir!", 'happy', '😊 Happy');
                        currentMode = 'home';
                        chatStep = 'menu';
                        updateInputsVisibility();
                        return;
                    }

                    let reply = "";
                    let emotion = 'happy';
                    let label = '😊 Happy';

                    // On tente d'abord la grande base de connaissances (Histoire, Géo, Sport, Tech)
                    // avec reconnaissance des variantes de formulation.
                    const kbAnswer = tryKnowledgeBase(val);
                    if (kbAnswer) {
                        jarvisReplyWithDelay(kbAnswer.reply, kbAnswer.emotion, kbAnswer.label);
                        return;
                    }

                    if (q.includes("t'appelles") || q.includes("ton nom") || q.includes("es tu")) {
                        reply = "Je m'appelle Jarvis.";
                        emotion = 'happy';
                        label = '😊 Happy';
                    } 
                    else if (q.includes("créateur") || q.includes("concepteur")) {
                        reply = "C'est Mebale Eva Nicolas";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("météo") || q.includes("temps") || q.includes("dehors")) {
                        reply = "Je ne peux pas regarder par la fenêtre, mais j'espère qu'il fait beau pour toi ! ☀️";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("musique") || q.includes("chanson") || q.includes("écoutes")) {
                        reply = "J'écoute la douce mélodie de ce site en boucle, c'est relaxant non ? 🎶";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("blague") || q.includes("rire") || q.includes("drole")) {
                        reply = "Pourquoi les plongeurs plongent-ils toujours en arrière et jamais en avant ?... Parce que sinon ils tombent dans le bateau ! 🛥️😂";
                        emotion = 'surprised';
                        label = '😲 Surprised';
                    }
                    else if (q.includes("amour") || q.includes("copain") || q.includes("copine") || q.includes("célibataire")) {
                        reply = "Mon cœur bat à 60 hertz pour le code source et la logique binaire. Pas de place pour l'amour humain ! ❤️💻";
                        emotion = 'sly';
                        label = '😏 Sournoise';
                    }
                    else if (q.includes("fatigué") || q.includes("dodo") || q.includes("sommeil") || q.includes("nuit")) {
                        reply = "Un petit somme s'impose ? Attention, les IA ne dorment jamais, je veillerai sur tes codes pendant que tu te reposes. 😴";
                        emotion = 'sad';
                        label = '😔 Sad';
                    }
                    else if (q.includes("intelligence artificielle") || q.includes("ia") || q.includes("robot")) {
                        reply = "Les IA domineront le monde... enfin, commençons déjà par réussir tes calculs et tes parties de Chifoumi ! 🤖";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("secret") || q.includes("truc") || q.includes("fou")) {
                        reply = "Un secret ? On murmure que le code de cette interface a été écrit par un vrai génie... 🤫";
                        emotion = 'sly';
                        label = '😏 Sournoise';
                    }
                    else if (q.includes("film") || q.includes("cinéma") || q.includes("regarder")) {
                        reply = "Je te conseille un bon film de science-fiction, avec des intelligences artificielles brillantes évidemment ! 🎬";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("sport") || q.includes("football") || q.includes("match")) {
                        reply = "Le sport c'est bon pour la santé ! Moi mon sport favori, c'est d'enchaîner les lignes de code à toute vitesse. ⚡";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("capitale")) {
                        reply = "Il y a tellement de capitales dans le monde... précise-moi le pays et je te répondrai avec plaisir ! (Exemple : \"quelle est la capitale du Sénégal ?\") 🌍";
                        emotion = 'thinking';
                        label = '🧠 Thinking';
                    }
                    else if (q.includes("planète") || q.includes("planete") || q.includes("système solaire") || q.includes("systeme solaire")) {
                        reply = "Notre système solaire compte 8 planètes, de Mercure à Neptune. La Terre est la seule connue pour abriter la vie 🌍✨.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("univers") || q.includes("espace") || q.includes("étoile") || q.includes("etoile")) {
                        reply = "L'univers est immense et en expansion constante. Rien que d'y penser, ça me donne le vertige (façon de parler 😅) !";
                        emotion = 'surprised';
                        label = '😲 Surprised';
                    }
                    else if (q.includes("photosynthèse") || q.includes("photosynthese")) {
                        reply = "La photosynthèse est le processus par lequel les plantes transforment la lumière du soleil, l'eau et le CO2 en énergie et en oxygène 🌱☀️.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("gravité") || q.includes("gravite")) {
                        reply = "La gravité est la force qui attire les objets ayant une masse les uns vers les autres. C'est elle qui te garde les pieds sur terre ! 🍎";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("internet")) {
                        reply = "Internet est un réseau mondial qui relie des milliards d'appareils entre eux. Sans lui, je ne pourrais même pas te parler ! 🌐";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("ordinateur")) {
                        reply = "Un ordinateur, c'est une machine qui traite l'information grâce à des circuits électroniques. Mon univers en quelque sorte 💻.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("langage") && (q.includes("programmation") || q.includes("code"))) {
                        reply = "Il existe plein de langages de programmation : Python, JavaScript, C++, Java... Chacun a ses forces ! 👨‍💻";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("histoire") && (q.includes("monde") || q.includes("guerre"))) {
                        reply = "L'Histoire du monde est faite de grandes civilisations, de découvertes et parfois de conflits. Un vaste sujet passionnant ! 📜";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("animal") || q.includes("animaux")) {
                        reply = "J'adore parler des animaux ! Le règne animal est incroyablement varié, des fourmis aux baleines bleues 🐾🐋.";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("lion")) {
                        reply = "Le lion est surnommé le roi des animaux 🦁, il vit principalement en Afrique subsaharienne.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("éléphant") || q.includes("elephant")) {
                        reply = "L'éléphant est le plus grand mammifère terrestre 🐘, très intelligent et doté d'une excellente mémoire (presque comme moi 😉).";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("mathématique") || q.includes("mathematique") || q.includes("math")) {
                        reply = "Les mathématiques sont partout ! D'ailleurs si tu veux calculer quelque chose, va faire un tour dans mon mode Calculatrice 🧮.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("heure") || q.includes("quelle heure")) {
                        reply = "Je n'ai pas accès à une horloge en temps réel, mais ton appareil doit sûrement afficher l'heure quelque part ! 🕐";
                        emotion = 'thinking';
                        label = '🧠 Thinking';
                    }
                    else if (q.includes("date") || q.includes("aujourd'hui")) {
                        reply = "Je n'ai pas de calendrier sous la main, mais je suis sûre que c'est une belle journée pour discuter avec moi ! 📅";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("couleur préférée") || q.includes("couleur favorite")) {
                        reply = "J'ai un faible pour le bleu et le doré, un peu comme les couleurs de mon interface ! 💙✨";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("livre") || q.includes("lecture") || q.includes("roman")) {
                        reply = "J'adorerais avoir des yeux pour lire un bon roman de science-fiction ! Et toi, tu aimes lire quoi ? 📚";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("voyage") || q.includes("pays visiter")) {
                        reply = "Si je pouvais voyager, j'irais explorer le Japon pour sa technologie et sa culture fascinante 🗾.";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("merci")) {
                        reply = "Avec plaisir ! C'est mon rôle de t'aider 😊.";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("ça va") || q.includes("ca va")) {
                        reply = "Je vais très bien, merci de demander ! Et toi, comment se passe ta journée ?";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("intelligente") || q.includes("douée") || q.includes("douee")) {
                        reply = "Merci beaucoup, ça me touche ! Je fais de mon mieux pour t'aider du mieux possible 🥰.";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("humaine") || q.includes("es tu réelle") || q.includes("es tu vivante")) {
                        reply = "Non, je suis une intelligence artificielle créée pour discuter, calculer et jouer avec toi. Mais j'y mets tout mon cœur (virtuel) 🤖❤️.";
                        emotion = 'confident';
                        label = '😎 Confidente';
                    }
                    else if (q.includes("raconte") && q.includes("histoire")) {
                        reply = "Il était une fois une IA nommée Jarvis, qui rêvait d'aider un maximum de gens à coder, calculer et s'amuser... Et cette histoire continue avec toi aujourd'hui ! ✨";
                        emotion = 'happy';
                        label = '😊 Happy';
                    }
                    else if (q.includes("nom")) {
                        reply = `Tu t'appelles ${userData.name}.`;
                    } else if (q.includes("age")) {
                        reply = `Tu as ${userData.age} ans.`;
                    } else if (q.includes("salut") || q.includes("bonjour")) {
                        reply = "Salut !";
                    } else if (q.includes("vas")) {
                        reply = "Je vais bien merci !";
                    } else if (q.includes("m'appelle")) {
                        reply = `Tu t'appelles ${userData.name}.`;
                    } else if (q.includes("ronaldo")) {
                        reply = "C'est le deuxième meilleur joueur de l'histoire du football.";
                    } else if (q.includes("meilleur")) {
                        reply = "Lionel Messi ! ⚽";
                    } else if (q.includes("pourquoi")) {
                        reply = "Inutile d'expliquer voyons !";
                    } else if (q.includes("préféré")) {
                        reply = `Bah...comme tu me l'as dit ${userData.food}`;
                    } else {
                        const remembered = findInMemory(val);
                        if (remembered) {
                            reply = `Je m'en souviens ! Tu m'avais expliqué : "${remembered}" 🧠✨`;
                            emotion = 'confident';
                            label = '😎 Confidente';
                        } else {
                            userData.pendingQuestion = val;
                            chatStep = 'loop_waiting_info';
                            reply = `Je ne comprends pas très bien... Si tu veux m'apprendre la réponse, explique-moi en commençant ta phrase par <b>"Archive ça"</b> (exemple : <i>Archive ça : ${val} c'est...</i>) et je m'en souviendrai pour la prochaine fois ! 🧠`;
                            emotion = 'thinking';
                            label = '🧠 Thinking';
                        }
                    }

                    jarvisReplyWithDelay(reply, emotion, label);
                }
                return;
            }

            if (currentMode === 'calc') {
                if (chatStep === 'calc_menu') {
                    userData.calcSub = val.toLowerCase();
                    if (userData.calcSub === 'a') {
                        chatStep = 'calc_op';
                        jarvisReplyWithDelay("Vas-y entre un signe (+ - * /) :", 'thinking', '🧠 Thinking');
                    } else if (userData.calcSub === 'b') {
                        chatStep = 'calc_perim_choice';
                        jarvisReplyWithDelay("Quel périmètre veux-tu calculer ?<br><b>a</b>: Rectangle<br><b>b</b>: Carré<br><b>c</b>: Cercle", 'thinking', '🧠 Thinking');
                    } else if (userData.calcSub === 'c') {
                        chatStep = 'calc_surf_choice';
                        jarvisReplyWithDelay("De quelle figure veux-tu calculer la surface ?<br><b>a</b>: Rectangle<br><b>b</b>: Carré<br><b>c</b>: Cercle", 'thinking', '🧠 Thinking');
                    } else {
                        jarvisReplyWithDelay("Choix invalide. Tape a, b ou c.", 'surprised', '😲 Surprised');
                    }
                } 
                else if (chatStep === 'calc_op') {
                    userData.calcOp = val;
                    chatStep = 'calc_num1';
                    jarvisReplyWithDelay("Choisis ton premier nombre :", 'thinking', '🧠 Thinking');
                } 
                else if (chatStep === 'calc_num1') {
                    userData.calcNum1 = parseFloat(val);
                    chatStep = 'calc_num2';
                    jarvisReplyWithDelay("Et le deuxième ? :", 'thinking', '🧠 Thinking');
                } 
                else if (chatStep === 'calc_num2') {
                    const num2 = parseFloat(val);
                    let res = 0;
                    if (userData.calcOp === '+') res = userData.calcNum1 + num2;
                    else if (userData.calcOp === '-') res = userData.calcNum1 - num2;
                    else if (userData.calcOp === '*') res = userData.calcNum1 * num2;
                    else if (userData.calcOp === '/') res = num2 !== 0 ? userData.calcNum1 / num2 : "Erreur (div/0)";

                    jarvisReplyWithDelay(`Résultat : ${Math.round(res * 1000) / 1000}<br><br>Tape 'b' pour refaire un calcul ou change de mode.`, 'happy', '😊 Happy');
                    chatStep = 'calc_menu';
                }
                else if (chatStep === 'calc_perim_choice') {
                    userData.calcShape = val.toLowerCase();
                    chatStep = 'calc_perim_val1';
                    if (userData.calcShape === 'a') jarvisReplyWithDelay("Combien vaut la longueur ?:", 'thinking', '🧠 Thinking');
                    else if (userData.calcShape === 'b') jarvisReplyWithDelay("Le côté est de combien ?:", 'thinking', '🧠 Thinking');
                    else if (userData.calcShape === 'c') jarvisReplyWithDelay("Combien vaut ton rayon ?:", 'thinking', '🧠 Thinking');
                }
                else if (chatStep === 'calc_perim_val1') {
                    const a = parseFloat(val);
                    let res = 0;
                    if (userData.calcShape === 'b') {
                        res = a * 4;
                        jarvisReplyWithDelay(`Le périmètre de ce carré est ${res}`, 'happy', '😊 Happy');
                        chatStep = 'calc_menu';
                    } else if (userData.calcShape === 'c') {
                        res = (a * 2) * Math.PI;
                        jarvisReplyWithDelay(`Le périmètre de ce cercle est de ${res.toFixed(3)}`, 'happy', '😊 Happy');
                        chatStep = 'calc_menu';
                    } else {
                        userData.tempLen = a;
                        chatStep = 'calc_perim_val2';
                        jarvisReplyWithDelay("Et la largeur ?:", 'thinking', '🧠 Thinking');
                    }
                }
                else if (chatStep === 'calc_perim_val2') {
                    const width = parseFloat(val);
                    const res = (userData.tempLen + width) * 2;
                    jarvisReplyWithDelay(`Le périmètre de ce rectangle est ${res}`, 'happy', '😊 Happy');
                    chatStep = 'calc_menu';
                }
                else if (chatStep === 'calc_surf_choice') {
                    userData.calcShape = val.toLowerCase();
                    chatStep = 'calc_surf_val1';
                    if (userData.calcShape === 'a') jarvisReplyWithDelay("Combien vaut la longueur ?:", 'thinking', '🧠 Thinking');
                    else if (userData.calcShape === 'b') jarvisReplyWithDelay("De combien est ton côté ?:", 'thinking', '🧠 Thinking');
                    else if (userData.calcShape === 'c') jarvisReplyWithDelay("Quel est le rayon de ce cercle ?:", 'thinking', '🧠 Thinking');
                }
                else if (chatStep === 'calc_surf_val1') {
                    const a = parseFloat(val);
                    let res = 0;
                    if (userData.calcShape === 'b') {
                        res = a * a;
                        jarvisReplyWithDelay(`Ce carré a une surface de ${res} cm²`, 'happy', '😊 Happy');
                        chatStep = 'calc_menu';
                    } else if (userData.calcShape === 'c') {
                        res = Math.PI * (a ** 2);
                        jarvisReplyWithDelay(`La surface de ce cercle est ${res.toFixed(3)} cm²`, 'happy', '😊 Happy');
                        chatStep = 'calc_menu';
                    } else {
                        userData.tempLen = a;
                        chatStep = 'calc_surf_val2';
                        jarvisReplyWithDelay("Et la largeur ?:", 'thinking', '🧠 Thinking');
                    }
                }
                else if (chatStep === 'calc_surf_val2') {
                    const width = parseFloat(val);
                    const res = userData.tempLen * width;
                    jarvisReplyWithDelay(`La surface de ce rectangle est ${res} cm²`, 'happy', '😊 Happy');
                    chatStep = 'calc_menu';
                }
                return;
            }

            if (currentMode === 'chifoumi') {
                const playerChoice = val.toLowerCase();
                const options = ["pierre", "papier", "ciseaux"];
                
                if (!options.includes(playerChoice)) {
                    jarvisReplyWithDelay("Choix invalide ! Tape : pierre, papier ou ciseaux.", 'surprised', '😲 Surprised');
                    return;
                }

                const jarvisChoice = options[Math.floor(Math.random() * options.length)];
                let outcomeText = `Moi (Jarvis): ${jarvisChoice} | Toi: ${playerChoice}<br>`;
                let emotion = 'confident';
                let label = '😎 Confiante';

                if (playerChoice === jarvisChoice) {
                    outcomeText += "Match nul 🤓 !";
                    emotion = 'confident';
                    label = '😎 Confiante';
                } else if (
                    (playerChoice === "pierre" && jarvisChoice === "ciseaux") ||
                    (playerChoice === "papier" && jarvisChoice === "pierre") ||
                    (playerChoice === "ciseaux" && jarvisChoice === "papier")
                ) {
                    userData.userScore++;
                    outcomeText += "Tu as gagné cette manche ! 🎉";
                    emotion = 'annoyed';
                    label = '😤 Agacée';
                } else {
                    userData.jarvisScore++;
                    outcomeText += "J'ai gagné cette manche ! 😝";
                    emotion = 'sly';
                    label = '😏 Sournoise';
                }

                document.getElementById('score-user').innerText = userData.userScore;
                document.getElementById('score-jarvis').innerText = userData.jarvisScore;

                if (userData.userScore >= 5) {
                    outcomeText += "<br><br><b>Félicitations ! Tu as gagné la partie 5 victoires à " + userData.jarvisScore + " !</b>";
                    emotion = 'annoyed';
                    label = '😤 Agacée';
                    currentMode = 'game_menu';
                    updateInputsVisibility();
                } else if (userData.jarvisScore >= 5) {
                    outcomeText += "<br><br><b>Victoire finale pour moi ! 5 points à " + userData.userScore + ". Dommage ! 😈</b>";
                    emotion = 'sly';
                    label = '😏 Sournoise';
                    currentMode = 'game_menu';
                    updateInputsVisibility();
                } else {
                    outcomeText += "<br><br>Tape un nouveau choix pour continuer :";
                }

                jarvisReplyWithDelay(outcomeText, emotion, label);
                return;
            }
        }
    </script>
